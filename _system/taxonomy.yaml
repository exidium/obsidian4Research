version: 2
updated: 2026-11-06
source: "Mirrors the ADI SDP UX Research workspace tag boards (Confluence: Tag Reference, Research Tagging Governance). Workspace tags are admin-controlled: never add, rename, or deprecate here without the UXR team."
rules:
  - Tag form is dimension/slug, lowercase, kebab-case. Dimension names here are reserved; project tag groups must not reuse them.
  - Every highlight carries at least one workspace tag. Most carry 2-3 tags across different dimensions (e.g. insight + functionality + journey), plus project tags for domain precision.
  - Tag what is being discussed, not who is discussing it (experience, market, software describe the content of the highlight).
  - Priority when tagging - 1 existing workspace tag, 2 existing project tag, 3 leave untagged, 4 propose a new project tag (status proposed, researcher decides). AI never proposes workspace tags.
  - Tags classify moments. Themes emerge from patterns across highlights; they are written as insights, not tags.
dimensions:
  experience:
    board: "*Research (Global) / Experience Level"
    description: The experience level being described in the moment, not the participant's profile.
    tags:
      - id: experience/beginner
        definition: Participant's words indicate newness to the domain or tool (learning, first encounter, unfamiliarity).
        status: active
      - id: experience/intermediate
        definition: Participant's words indicate working knowledge (competent use, some years of practice).
        status: active
      - id: experience/advanced
        definition: Participant's words indicate expert depth (teaches others, deep domain reasoning, edge-case fluency).
        status: active
  functionality:
    board: "*Research (Global) / Functionality"
    description: Separates missing from broken from unnecessary. Product managers filter by this first.
    tags:
      - id: functionality/new-feature-request
        definition: Participant explicitly asks for something that does not exist.
        status: active
      - id: functionality/existing-feature
        definition: Participant references something that already exists (use to validate awareness).
        status: active
      - id: functionality/feature-removal-request
        definition: Participant wants something taken away or simplified.
        status: active
      - id: functionality/bug
        definition: Participant describes broken behaviour (not a gap; actually broken).
        status: active
      - id: functionality/workaround
        definition: Participant describes a hack or alternative path to achieve their goal. Direct evidence of unmet need.
        status: active
  insight:
    board: "*Research (Global) / Insights"
    description: High-level buckets for quick scanning. Usually paired with a functionality tag.
    tags:
      - id: insight/pain-point
        definition: Any moment of frustration, friction, or failure.
        status: active
      - id: insight/desire
        definition: Aspiration or wish; softer and more emotional than a feature request.
        status: active
  sentiment:
    board: "*Research (Global) / Sentiment"
    description: Enables positive vs negative counts per topic across projects.
    tags:
      - id: sentiment/positive
        definition: Clear satisfaction, praise, or delight expressed.
        status: active
      - id: sentiment/neutral
        definition: Factual statement with no emotional charge (typical for workflow descriptions).
        status: active
      - id: sentiment/negative
        definition: Frustration, disappointment, or criticism expressed.
        status: active
      - id: sentiment/confused
        definition: Participant is uncertain, misunderstanding, or lost.
        status: active
  ops:
    board: "*Research (Global) / Research Ops"
    description: Action tracking for the research team. Not for analysis; hidden from stakeholder views.
    tags:
      - id: ops/follow-up-depth
        definition: This topic needs deeper probing in a future session.
        status: active
      - id: ops/follow-up-clarification
        definition: Something was unclear; verify with the participant.
        status: active
      - id: ops/follow-up-referral
        definition: Participant mentioned someone else we should talk to.
        status: active
  journey:
    board: "*Journey Stage"
    description: Where in the engineer's workflow the moment happens. UNVERIFIED LIST - confirm against the *Journey Stage board in Dovetail before relying on it.
    tags:
      - id: journey/discover
        definition: Finding out what exists; requirements, feasibility, first contact with a product or tool.
        status: active
      - id: journey/evaluate
        definition: Comparing options, reading datasheets, trying eval boards, deciding what to adopt.
        status: active
      - id: journey/design
        definition: Active design work; architecture, selection, configuration, simulation.
        status: active
      - id: journey/integrate
        definition: Moving work between tools or into the production flow; exports, handoffs.
        status: active
      - id: journey/validate
        definition: Testing on hardware, correlating, signing off.
        status: active
      - id: journey/support
        definition: Getting help; documentation, FAEs, portals, reporting problems.
        status: active
  software:
    board: "*ADI (Global) / Software"
    description: Which ADI product is being discussed in the highlight. Apply on every relevant mention.
    tags:
      - {id: software/ace, definition: ACE Analysis Control Evaluation platform., status: active}
      - {id: software/ace-dvd, definition: Device View Designer within ACE., status: active}
      - {id: software/a2b-bus-analyzer, definition: A2B audio bus tool., status: active}
      - {id: software/analog-com, definition: analog.com website experience., status: active}
      - {id: software/data-mesh, definition: ADI Data Mesh initiative., status: active}
      - {id: software/ee-sim, definition: EE-Sim simulation tool., status: active}
      - {id: software/harmonic-design-system, definition: Harmonic design system., status: active}
      - {id: software/interactive-engineering-solutions, definition: IES platform., status: active}
      - {id: software/ltpowercad, definition: LTpowerCAD tool., status: active}
      - {id: software/ltspice, definition: LTspice simulation tool., status: active}
      - {id: software/noise-tool, definition: Noise analysis tool., status: active}
      - {id: software/pdt, definition: Product Development Tools platform., status: active}
      - {id: software/fluxbench-designer, definition: FICTIONAL demo product; delete for real use., status: active}
  market:
    board: "*ADI (Global) / Market"
    description: Which market is being discussed in the highlight, which may differ from the participant's own.
    tags:
      - {id: market/aerospace-defence, definition: A&D context, requirements, or practices., status: active}
      - {id: market/automotive, definition: Automotive context., status: active}
      - {id: market/broad-market, definition: General or non-specific market context., status: active}
      - {id: market/communications, definition: Comms, 5G, or wireless context., status: active}
      - {id: market/consumer, definition: Consumer electronics context., status: active}
      - {id: market/data-center, definition: Data center or cloud infrastructure context., status: active}
      - {id: market/digital-healthcare, definition: Medical or healthcare tech context., status: active}
      - {id: market/energy, definition: Power generation, grid, or renewables context., status: active}
      - {id: market/industrial-automation, definition: Factory automation or IIoT context., status: active}
      - {id: market/instrumentation-measurement, definition: Test and measurement context., status: active}
      - {id: market/intelligent-buildings, definition: Smart building or BMS context., status: active}
